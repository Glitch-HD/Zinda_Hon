# Runs on every push and pull request: type check, unit tests, production build, then the app is
# started against a fresh Postgres and the end-to-end and attack suites are run against it.
# A red check here means: do not demo this commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zh
          POSTGRES_PASSWORD: zh
          POSTGRES_DB: zinda_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zh:zh@localhost:5432/zinda_ci
      DIRECT_URL: postgresql://zh:zh@localhost:5432/zinda_ci
      # Test-only secrets, used just inside this throwaway run.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      QR_SIGNING_SECRET: ci-only-qr-secret-not-used-anywhere-else-0123456789
      # No AI keys: CI checks that every AI feature falls back safely when the AI is missing.
      FREE_TTS: "off"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Database migrations and demo data
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts
      - name: Production build
        run: npx next build
      - name: Start the app
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
      - name: End-to-end smoke tests
        run: node tests/smoke.mjs http://localhost:3000
      - name: Fresh demo data for the attack suite
        # The smoke test closed some cases, so wipe this throwaway CI database and seed it again.
        run: |
          pkill -f "next start" || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npx prisma migrate deploy && npx tsx prisma/seed.ts
          npx next start -p 3000 >> server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
      - name: Attack suite (security)
        run: node tests/attack.mjs http://localhost:3000 "$DATABASE_URL"
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log
